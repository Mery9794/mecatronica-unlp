
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title">Solicitud de Registro Profesional</h3>

          <ul class="nav nav-tabs">
            <li class="nav-item">
              <a class="nav-link"
                 [class.active]="parteVisible === 'datosGenerales'"
                 (click)="mostrarParte('datosGenerales')">
                Datos Generales
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link"
                 [class.active]="parteVisible === 'contacto'"
                 (click)="mostrarParte('contacto')">
                Contacto
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link"
                 [class.active]="parteVisible === 'perfil'"
                 (click)="mostrarParte('perfil')">
                Perfil
              </a>
            </li>
          </ul>

          <form [formGroup]="registroForm" (ngSubmit)="registrarProfesional()">

            <!-- Parte 1: Datos Generales -->
            <div *ngIf="parteVisible === 'datosGenerales'">

              <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input
                  type="text"
                  id="nombre"
                  class="form-control"
                  formControlName="nombre"
                  required />
              </div>

              <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input
                  type="text"
                  id="apellido"
                  class="form-control"
                  formControlName="apellido"
                  required />
              </div>

              <div class="form-group">
                <label for="dni">DNI:</label>
                <input
                  type="text"
                  id="dni"
                  class="form-control"
                  formControlName="dni"
                  required />
              </div>

              <div class="form-group">
                <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                <input
                  type="date"
                  id="fechaNacimiento"
                  class="form-control"
                  formControlName="fechaNacimiento"
                  required />
              </div>

              <div class="form-group">
                <label>Sexo:</label>

                <div class="form-check">
                  <input
                    type="radio"
                    id="sexoMasculino"
                    class="form-check-input"
                    formControlName="sexo"
                    value="Masculino" />
                  <label class="form-check-label" for="sexoMasculino">
                    Masculino
                  </label>
                </div>

                <div class="form-check">
                  <input
                    type="radio"
                    id="sexoFemenino"
                    class="form-check-input"
                    formControlName="sexo"
                    value="Femenino" />
                  <label class="form-check-label" for="sexoFemenino">
                    Femenino
                  </label>
                </div>
              </div>
            </div>

            <!-- Parte 2: Contacto -->
            <div *ngIf="parteVisible === 'contacto'">

              <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  formControlName="email"
                  required />
              </div>

              <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input
                  type="text"
                  id="telefono"
                  class="form-control"
                  formControlName="telefono"
                  required />
              </div>
            </div>

            <!-- Parte 3: Perfil -->
            <div *ngIf="parteVisible === 'perfil'">

              <div class="form-group">
                <label>Tipo de solicitud:</label>
                <input
                  type="text"
                  class="form-control"
                  value="Profesional Médico"
                  disabled />
              </div>

              <p class="text-muted">
                Tu solicitud será enviada para su revisión.
                Una vez aprobada por Administración, podrás acceder
                al Portal Médico.
              </p>
            </div>

            <!-- Navegación -->
            <div class="d-flex justify-content-between mt-3">

              <button
                *ngIf="parteVisible !== 'datosGenerales'"
                type="button"
                class="btn btn-secondary"
                (click)="mostrarParteAnterior()">
                Atrás
              </button>

              <button
                *ngIf="parteVisible !== 'perfil'"
                type="button"
                class="btn btn-primary"
                (click)="mostrarParteSiguiente()">
                Siguiente
              </button>

              <button
                *ngIf="parteVisible === 'perfil'"
                type="submit"
                class="btn btn-primary"
                id="btnRegistrar"
                [disabled]="registroForm.invalid">
                Enviar solicitud
              </button>

            </div>
          </form>

          <!-- Confirmación -->
          <div *ngIf="registroExitoso" class="alert alert-success mt-3">
            Tu solicitud fue enviada correctamente.
            Queda pendiente de aprobación administrativa.
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
