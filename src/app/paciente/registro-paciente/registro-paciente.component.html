<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-body">

          <h3 class="card-title">Registro de Paciente</h3>

          <ul class="nav nav-tabs">
            <li class="nav-item">
              <a
                class="nav-link"
                [class.active]="parteVisible === 'datosGenerales'"
                (click)="mostrarParte('datosGenerales')">
                Datos Generales
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link"
                [class.active]="parteVisible === 'contacto'"
                (click)="mostrarParte('contacto')">
                Contacto
              </a>
            </li>
          </ul>

          <form [formGroup]="registroForm" (ngSubmit)="registrarPaciente()">

            <!-- Parte 1: Datos Generales -->
            <div
              *ngIf="parteVisible === 'datosGenerales'"
              class="parte-formulario">

              <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input
                  type="text"
                  id="nombre"
                  class="form-control"
                  formControlName="nombre"
                  placeholder="Nombre"
                  required>
              </div>

              <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input
                  type="text"
                  id="apellido"
                  class="form-control"
                  formControlName="apellido"
                  placeholder="Apellido"
                  required>
              </div>

              <div class="form-group">
                <label for="dni">DNI:</label>
                <input
                  type="text"
                  id="dni"
                  class="form-control"
                  formControlName="dni"
                  placeholder="DNI"
                  required>
              </div>

              <div class="form-group">
                <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                <input
                  type="date"
                  id="fechaNacimiento"
                  class="form-control"
                  formControlName="fechaNacimiento"
                  required>
              </div>

              <div class="form-group">
                <label>Sexo:</label>

                <div class="form-check">
                  <input
                    type="radio"
                    id="sexoMasculino"
                    class="form-check-input"
                    formControlName="sexo"
                    value="Masculino">

                  <label
                    class="form-check-label"
                    for="sexoMasculino">
                    Masculino
                  </label>
                </div>

                <div class="form-check">
                  <input
                    type="radio"
                    id="sexoFemenino"
                    class="form-check-input"
                    formControlName="sexo"
                    value="Femenino">

                  <label
                    class="form-check-label"
                    for="sexoFemenino">
                    Femenino
                  </label>
                </div>
              </div>

              <!-- Obra Social -->
              <div class="form-group">
                <label for="tieneObraSocial">
                  ¿Tiene Obra Social?
                </label>

                <input
                  type="checkbox"
                  id="tieneObraSocial"
                  class="form-check-input"
                  formControlName="tieneObraSocial">
              </div>

              <div
                class="form-group"
                *ngIf="registroForm.get('tieneObraSocial')?.value">

                <label for="nombreObraSocial">
                  Nombre de la Obra Social:
                </label>

                <input
                  type="text"
                  id="nombreObraSocial"
                  class="form-control"
                  formControlName="nombreObraSocial"
                  placeholder="Nombre de la Obra Social">
              </div>

            </div>

            <!-- Parte 2: Contacto -->
            <div
              *ngIf="parteVisible === 'contacto'"
              class="parte-formulario">

              <div class="form-group">
                <label for="email">Correo Electrónico:</label>

                <input
                  type="email"
                  id="email"
                  class="form-control"
                  formControlName="email"
                  placeholder="Email"
                  required>
              </div>

              <div class="form-group">
                <label for="telefono">Teléfono:</label>

                <input
                  type="tel"
                  id="telefono"
                  class="form-control"
                  formControlName="telefono"
                  placeholder="Teléfono"
                  required>
              </div>

            </div>

            <!-- Botones de navegación -->
            <div class="d-flex justify-content-between mt-3">

              <button
                type="button"
                class="btn btn-secondary"
                (click)="mostrarParteAnterior()"
                *ngIf="parteVisible === 'contacto'">
                Atrás
              </button>

              <button
                type="button"
                class="btn btn-primary"
                (click)="mostrarParteSiguiente()"
                *ngIf="parteVisible === 'datosGenerales'">
                Siguiente
              </button>

              <button
                type="submit"
                class="btn btn-primary"
                *ngIf="parteVisible === 'contacto'">
                Registrar
              </button>

            </div>

          </form>

          <!-- Mensaje de registro exitoso -->
          <div
            *ngIf="registroExitoso"
            class="alert alert-success mt-3">
            Se ha registrado correctamente.
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
